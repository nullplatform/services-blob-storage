# Creates the link's blob container and issues a SAS token scoped to it, then
# writes the container name and token to the link attributes.
provider_categories:
  - cloud-providers

steps:
  - name: resolve azure credentials
    type: script
    file: $SERVICE_PATH/scripts/azure/resolve_azure_credentials
    output:
      - name: ARM_SUBSCRIPTION_ID
        type: environment
      - name: ARM_CLIENT_ID
        type: environment
      - name: ARM_TENANT_ID
        type: environment
      # Propagated like aws-s3-bucket propagates AWS_SECRET_ACCESS_KEY. Empty
      # when the agent uses a managed identity.
      - name: ARM_CLIENT_SECRET
        type: environment

  - name: build context
    type: script
    file: $SERVICE_PATH/scripts/azure/build_context
    output:
      - name: OUTPUT_DIR
        type: environment
      - name: TOFU_MODULE_DIR
        type: environment
      - name: TOFU_INIT_VARIABLES
        type: environment
      - name: TOFU_VARIABLES
        type: environment
      - name: TFSTATE_CONTAINER
        type: environment
      - name: TFSTATE_STORAGE_ACCOUNT
        type: environment
      - name: TFSTATE_RESOURCE_GROUP
        type: environment
      - name: LINK_ID
        type: environment
      - name: LINK_NAME
        type: environment
      - name: SCOPE_ID
        type: environment
      - name: SCOPE_NRN
        type: environment
      - name: SCOPE_SLUG
        type: environment
      - name: APP_SLUG
        type: environment
      - name: APP_NRN
        type: environment
      - name: LINK_CONTAINER_NAME
        type: environment
      - name: LINK_ACCESS_LEVEL
        type: environment
      - name: LINK_SAS_TTL_DAYS
        type: environment

  - name: build permissions context
    type: script
    file: $SERVICE_PATH/scripts/azure/build_permissions_context
    output:
      - name: OUTPUT_DIR
        type: environment
      - name: TOFU_MODULE_DIR
        type: environment
      - name: TOFU_INIT_VARIABLES
        type: environment
      - name: TOFU_VARIABLES
        type: environment
      # Set only on the unlink-with-no-container early exit, so do_tofu and
      # write_link_outputs can no-op instead of inheriting a stale
      # deployment/ TOFU_MODULE_DIR from build_context. Must be declared here
      # or the engine never propagates it to the following steps.
      - name: NP_SKIP_TOFU
        type: environment

  - name: tofu
    type: script
    file: $SERVICE_PATH/scripts/azure/do_tofu
    configuration:
      TOFU_ACTION: apply

  - name: write link outputs
    type: script
    file: $SERVICE_PATH/scripts/azure/write_link_outputs
