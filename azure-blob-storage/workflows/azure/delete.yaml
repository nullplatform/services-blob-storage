# Destroys the Storage Account.
#
# The tfstate blob is deliberately left behind: removing it would need an `az`
# binary the agent image does not carry, and an orphaned few-KB state blob is a
# far smaller problem than a delete action that cannot complete. Clean the
# azure-blob-storage/<service_id>/ prefix out of band if it ever matters.
#
# DESTRUCTIVE: deleting the Storage Account deletes every container inside it,
# including containers created by links, and all their data.
provider_categories:
  - cloud-providers

steps:
  - name: resolve azure credentials
    type: script
    file: $SERVICE_PATH/scripts/azure/resolve_azure_credentials
    output:
      - name: ARM_SUBSCRIPTION_ID
        type: environment
      - name: ARM_CLIENT_ID
        type: environment
      - name: ARM_TENANT_ID
        type: environment
      # Propagated like aws-s3-bucket propagates AWS_SECRET_ACCESS_KEY. Empty
      # when the agent uses a managed identity.
      - name: ARM_CLIENT_SECRET
        type: environment

  - name: build context
    type: script
    file: $SERVICE_PATH/scripts/azure/build_context
    output:
      - name: OUTPUT_DIR
        type: environment
      - name: TOFU_MODULE_DIR
        type: environment
      - name: TOFU_INIT_VARIABLES
        type: environment
      - name: TOFU_VARIABLES
        type: environment
      - name: TFSTATE_CONTAINER
        type: environment
      - name: TFSTATE_STORAGE_ACCOUNT
        type: environment
      - name: TFSTATE_RESOURCE_GROUP
        type: environment

  - name: tofu
    type: script
    file: $SERVICE_PATH/scripts/azure/do_tofu
    configuration:
      TOFU_ACTION: destroy

