# Reapplies the link's container and SAS after an attribute change (for
# example a new accessLevel or sas_ttl_days). Identical to link.yaml; the
# explicit replace keeps the include shape uniform with unlink.yaml.
include:
  - "$SERVICE_PATH/workflows/azure/link.yaml"

steps:
  - name: tofu
    type: script
    file: $SERVICE_PATH/scripts/azure/do_tofu
    action: replace
    configuration:
      TOFU_ACTION: apply
