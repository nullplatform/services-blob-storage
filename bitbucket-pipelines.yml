# nullplatform CI for Bitbucket Pipelines.
#
# Contract:  np build start  ->  build the image  ->  np asset push  ->  np build update
# There is no deploy step here: nullplatform triggers deployments itself.
#
# The only secret is NULLPLATFORM_API_KEY. nullplatform creates it as a *secured*
# repository variable when the application is created, and Bitbucket injects every
# repository variable into the step environment, so it is not declared below.
#
# Requires Pipelines to be ENABLED on the repository (Repository settings ->
# Pipelines -> Settings). It is off by default, even with this file present.
#
# NOTE: unlike GitHub Actions, GitLab CI or Azure DevOps, `np` cannot infer
# --repository/--branch/--commit-sha/--commit-permalink/--description from
# Bitbucket's built-in variables, so they're passed explicitly below (same
# workaround the .circleci/config.yml template in this repo already uses).

image: public.ecr.aws/nullplatform/np-cli:kaniko

definitions:
  steps:
    - step: &nullplatform-build
        name: nullplatform build
        script:
          - REPOSITORY_URL="https://bitbucket.org/${BITBUCKET_WORKSPACE}/${BITBUCKET_REPO_SLUG}"
          - COMMIT_PERMALINK="${REPOSITORY_URL}/commits/${BITBUCKET_COMMIT}"
          - DESCRIPTION="$(git log -1 --pretty=%B)"
          - /np build start
            --repository "$REPOSITORY_URL"
            --branch "$BITBUCKET_BRANCH"
            --commit-sha "$BITBUCKET_COMMIT"
            --commit-permalink "$COMMIT_PERMALINK"
            --description "$DESCRIPTION"
            --format json --query .id > /tmp/np_build_id
          # kaniko requires a --destination even with --no-push; `foo:1` is a throwaway.
          - /kaniko/executor
            --context "$BITBUCKET_CLONE_DIR"
            --dockerfile "$BITBUCKET_CLONE_DIR/Dockerfile"
            --no-push
            --tarPath image.tar
            --destination foo:1
          - /np asset push --type docker-image --source image.tar --build-id "$(cat /tmp/np_build_id)" --repository "$REPOSITORY_URL"
          - /np build update --id "$(cat /tmp/np_build_id)" --status=successful
        after-script:
          # Bitbucket has no `if: always()` and no `when: on_failure`.
          # BITBUCKET_EXIT_CODE is defined ONLY in after-script, and after-script
          # always runs -- this is the failure path.
          #
          # On failure /tmp/np_build_id may hold `np`'s JSON error body instead of
          # an id (e.g. `np build start` itself failed), so only call build update
          # when it's actually a numeric id -- otherwise there's no build to update.
          - BUILD_ID="$(cat /tmp/np_build_id 2>/dev/null)"; if [ "$BITBUCKET_EXIT_CODE" -ne 0 ] && printf '%s' "$BUILD_ID" | grep -Eq '^[0-9]+$'; then /np build update --id "$BUILD_ID" --status=failed; fi

pipelines:
  branches:
    main:
      - step: *nullplatform-build
